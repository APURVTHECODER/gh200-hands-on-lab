name: GH200 Matrix

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Show matrix values
        run: |
          echo "OS = ${{ matrix.os }}"
          echo "Node = ${{ matrix.node }}"
