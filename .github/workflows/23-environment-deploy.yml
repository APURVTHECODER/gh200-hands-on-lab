name: GH200 Deployment Flow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: |
          echo "Building..."
          echo "Build successful"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Test
        run: |
          echo "Tests failed"
          exit 1

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy
        run: echo "Deploying to production"

  cleanup:
    needs: [build, test, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup
        run: echo "Cleanup runs regardless of previous result"
