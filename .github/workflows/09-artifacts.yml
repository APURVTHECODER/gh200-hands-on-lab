name: GH200 Artifacts

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create build output
        run: |
          mkdir -p build
          echo "GH200 BUILD ARTIFACT" > build/result.txt
          echo "Version=1.2.3" >> build/result.txt

      - name: Show file
        run: |
          cat build/result.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: build/result.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: build-result
          path: downloaded

      - name: Show downloaded file
        run: |
          ls -R downloaded
          cat downloaded/result.txt
