name: GH200 Environment Files

on:
  workflow_dispatch:

jobs:
  env-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Create variables
        run: |
          echo "BUILD_VERSION=2.5.0" >> "$GITHUB_ENV"
          echo "DEPLOY_TARGET=staging" >> "$GITHUB_ENV"

      - name: Read variables
        run: |
          echo "Version: $BUILD_VERSION"
          echo "Target: $DEPLOY_TARGET"

      - name: Change target
        run: |
          echo "DEPLOY_TARGET=production" >> "$GITHUB_ENV"

      - name: Read changed target
        run: |
          echo "Target: $DEPLOY_TARGET"
