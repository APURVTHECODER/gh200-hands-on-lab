name: GH200 Inputs Vars Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - development
          - staging
          - production

      version:
        description: "Version to deploy"
        required: true
        default: "1.0.0"
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show inputs
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Version: ${{ inputs.version }}"

      - name: Conditional production
        if: ${{ inputs.environment == 'production' }}
        run: echo "PRODUCTION DEPLOYMENT"

      - name: Non-production
        if: ${{ inputs.environment != 'production' }}
        run: echo "NON-PRODUCTION DEPLOYMENT"
