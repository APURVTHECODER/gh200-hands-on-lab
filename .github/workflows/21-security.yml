name: GH200 Token Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Show token permissions
        run: |
          echo "Event = ${{ github.event_name }}"
          echo "Repository = ${{ github.repository }}"
          echo "Token exists = ${{ github.token != '' }}"

      - name: Checkout
        uses: actions/checkout@v4
