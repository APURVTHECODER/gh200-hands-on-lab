name: GH200 Contexts

on:
  workflow_dispatch:

env:
  APP_ENV: training

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Context values
        run: |
          echo "Repository = ${{ github.repository }}"
          echo "Actor = ${{ github.actor }}"
          echo "Event = ${{ github.event_name }}"
          echo "Branch = ${{ github.ref_name }}"
          echo "Environment = $APP_ENV"

      - name: Expression
        if: ${{ github.ref_name == 'main' }}
        run: echo "We are on main"

      - name: Functions
        run: |
          echo "Contains = ${{ contains(github.repository, 'gh200') }}"
          echo "StartsWith = ${{ startsWith(github.ref, 'refs/heads/') }}"
