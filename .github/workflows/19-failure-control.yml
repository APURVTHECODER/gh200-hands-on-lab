name: GH200 Matrix Failure

on:
  workflow_dispatch:

jobs:

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

      matrix:
        version: [18, 20, 22]

    steps:

      - name: Test
        run: |
          echo "Testing Node ${{ matrix.version }}"

          if [ "${{ matrix.version }}" = "20" ]; then
            echo "Node 20 FAILED"
            exit 1
          fi

          echo "Node ${{ matrix.version }} passed"
